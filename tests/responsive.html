<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>生产页面响应式验证</title>
    <style>
      html,
      body {
        margin: 0;
        background: #eee;
      }
      iframe {
        display: block;
        border: 0;
      }
    </style>
  </head>
  <body>
    <script>
      const query = new URLSearchParams(location.search);
      const frame = document.createElement("iframe");
      frame.title = "生产版本视口";
      frame.width = String(
        Math.min(1920, Math.max(280, Number(query.get("width")) || 390)),
      );
      frame.height = String(
        Math.min(1200, Math.max(320, Number(query.get("height")) || 844)),
      );
      frame.src =
        "http://127.0.0.1:4173/" + (query.has("debug") ? "?debug=1" : "");
      document.body.append(frame);
    </script>
  </body>
</html>
